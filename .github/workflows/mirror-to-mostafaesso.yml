name: Mirror to mostafaesso

on:
  push:
    branches: ["**"]
    tags: ["**"]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Without this, checkout leaves an auth extraheader for github.com in
          # the git config that overrides our mirror URL credentials and the
          # push to the other account is rejected.
          persist-credentials: false
      - name: Push mirror to mostafaesso
        run: |
          git remote add mirror "https://x-access-token:${{ secrets.MIRROR_TOKEN }}@github.com/mostafaesso/${{ github.event.repository.name }}.git"
          git push mirror --all --force
          git push mirror --tags --force
